name: Collect A-share sector evidence

on:
  workflow_dispatch:
  schedule:
    # 03:38 UTC = 11:38 Asia/Shanghai, Monday through Friday.
    - cron: "38 3 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build midday evidence pack
        # Exits non-zero when data_status is not "ready".  That failure skips the
        # commit step below (GitHub Actions skips later steps by default), so the
        # previous good evidence pack stays in the repository, but the run turns
        # red instead of silently publishing an empty pack.
        run: python collector.py
      - name: Commit latest evidence
        run: |
          git config user.name "a-share-sector-bot"
          git config user.email "a-share-sector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update sector evidence"
          git push

      # Only runs when an earlier step failed.  Surfaces the reason recorded in
      # data/latest.json so a transient source outage is distinguishable from a
      # real regression.
      - name: Report collection failure
        if: failure()
        run: |
          echo "::error::A-share sector collection failed; data/latest.json was NOT refreshed (previous good data preserved)."
          if [ -f data/latest.json ]; then
            python -c "import json;d=json.load(open('data/latest.json',encoding='utf-8'));print('data_status:',d.get('data_status'));print('reason:',d.get('reason'))"
          fi
